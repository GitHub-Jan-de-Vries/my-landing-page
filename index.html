      border-radius: 6px;
      color: rgba(255, 255, 255, 0.45);
      font-family: "JetBrains Mono", "SF Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 0;
      overflow: hidden;
    }

    .lang-flag-btn:hover, .lang-flag-btn:focus-visible {
      font-size: 11px;
      color: #ffffff;
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
    }

    .lang-flag-btn.is-detected, .lang-flag-btn.is-selected {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.35);
      transform: scale(1.08);
    }

    /* Counter Grid Button Base Styling (Slots 7 & 8) */
    .counter-grid-btn {
      height: 32px;
      line-height: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.4);
      font-family: "JetBrains Mono", "SF Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      cursor: default;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 0;
      user-select: none;
    }

    /* Slot 8: Count-Up / Release Button (+typed) */
    .counter-grid-btn.btn-up.is-clickable {
      cursor: pointer;
      color: #00d2ff;
      background: rgba(0, 210, 255, 0.15);
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.35);
    }

    .counter-grid-btn.btn-up.is-clickable:hover {
      background: rgba(0, 210, 255, 0.3);
      transform: scale(1.06);
    }

    /* Slot 7: Count-Down Button Color States (-remaining) */
    /* State 1: text-length == 0 -> Default / neutral (grayed out) */
    .counter-grid-btn.btn-down.state-zero {
      color: rgba(255, 255, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: none;
      cursor: default;
    }

    /* State 2: text-length > 0 and < 300 -> YELLOW color */
    .counter-grid-btn.btn-down.state-yellow {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.6);
      background: rgba(245, 158, 11, 0.15);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
      cursor: pointer;
    }

    .counter-grid-btn.btn-down.state-yellow:hover {
      background: rgba(245, 158, 11, 0.3);
      border-color: #f59e0b;
      transform: scale(1.06);
    }

    /* State 3: text-length == 300 -> RED color */
    .counter-grid-btn.btn-down.state-red {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.8);
      background: rgba(239, 68, 68, 0.22);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.45);
      cursor: pointer;
    }

    .counter-grid-btn.btn-down.state-red:hover {
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      transform: scale(1.06);
    }

    
    /* Footer Sub-Row Container */
    

    /* 2x1 Grid Mode Switcher */
    

    

    
    /* Subrow Alignment Grid (Under Flags & Counters) */
    .grid-subrow {
      display: grid;
      grid-template-columns: repeat(6, 1fr) repeat(2, 1fr);
      gap: 4px;
      width: 100%;
      height: 28px;
      align-items: center;
      margin-top: 4px;
    }

    .grid-subrow.mode-int {
      grid-template-columns: repeat(10, 1fr) repeat(2, 1fr);
    }

    /* 2x1 Mode Switcher Container under Flag Buttons */
    .mode-switcher-container {
      grid-column: span 6;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 28px;
    }

    .grid-subrow.mode-int .mode-switcher-container {
      grid-column: span 10;
    }

    .mode-switch-btn {
      height: 28px;
      padding: 0 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: rgba(255, 255, 255, 0.7);
      font-family: "JetBrains Mono", "SF Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .mode-switch-btn .mode-icon {
      font-size: 18px;
      line-height: 1;
    }

    .mode-switch-btn .mode-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .mode-switch-btn:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
      color: #ffffff;
    }

    .mode-switch-btn.is-active {
      background: rgba(0, 210, 255, 0.2);
      border-color: #00d2ff;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.35);
    }

    /* Standalone ERASE Button Container & Style (Under Counter Buttons) */
    .erase-btn-container {
      grid-column: span 2;
      height: 28px;
    }

        .erase-btn {
      width: 100%;
      height: 28px;
      font-size: 10px;
      font-family: "JetBrains Mono", "SF Mono", monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(11, 19, 38, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 8px; /* EDIT REMINDER: Smooth 8px curves matching CLOSE button tag-team ergonomics */
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 12px rgba(0, 210, 255, 0.25); /* EDIT REMINDER: 3D drop shadow matching CLOSE button */
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      line-height: 1.2;
    }

    .erase-btn:hover, .erase-btn:focus-visible {
      color: #ffffff;
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    /* Vacant Placeholder Flag Buttons for 12x1 Grid */
    .lang-flag-btn.vacant-placeholder {
      color: rgba(255, 255, 255, 0.25);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.02);
      cursor: default;
    }

    .grid-container-row.mode-int {
      grid-template-columns: repeat(12, 1fr);
    }

    
        /* Viewport-Anchored Outer Navigation Controls (Decoupled Outside Card Bounding Box & 3D Stage) */
    .viewport-nav-bar {
      position: fixed;
      z-index: 999999; /* Top-most stacking context above all 3D perspective layers */
      pointer-events: auto;
    }

    .viewport-nav-west {
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    .viewport-nav-east {
      top: 50%;
      right: 0;
      transform: translateY(-50%);
    }

    .viewport-nav-south {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Stretched Snug Vertical Handles for West (◄) and East (►) Screen Borders */
    .viewport-nav-handle {
      width: 28px;
      height: 88px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 19, 38, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 210, 255, 0.45);
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.35), inset 0 0 10px rgba(0, 210, 255, 0.15);
      color: #00d2ff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      outline: none;
    }

    .nav-handle-west {
      border-radius: 0 12px 12px 0; /* Flush to left screen border */
      border-left: none;
    }

    .nav-handle-east {
      border-radius: 12px 0 0 12px; /* Flush to right screen border */
      border-right: none;
    }

    .viewport-nav-handle:hover, .viewport-nav-handle:focus-visible {
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      color: #ffffff;
      box-shadow: 0 0 24px rgba(0, 210, 255, 0.65);
    }

    .nav-handle-west:hover {
      transform: translateX(4px);
    }

    .nav-handle-east:hover {
      transform: translateX(-4px);
    }

    .version-south-badge {
      font-family: "JetBrains Mono", "SF Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(11, 19, 38, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 210, 255, 0.4);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 12px rgba(0, 210, 255, 0.25);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .version-south-badge .south-arrow {
      display: inline-block;
      opacity: 0;
      width: 0;
      max-width: 0;
      overflow: hidden;
      transform: translateY(-2px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #00d2ff;
    }

    .version-south-badge:hover, .version-south-badge:focus-visible {
      color: #00d2ff;
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.45);
      transform: translateY(-2px);
    }

    .version-south-badge:hover .south-arrow, .version-south-badge:focus-visible .south-arrow {
      opacity: 1;
      width: 14px;
      max-width: 14px;
      transform: translateY(0px);
    }

    .version-south-badge.is-warning, .viewport-nav-handle.is-warning {
      border-color: #f59e0b !important;
      color: #f59e0b !important;
      background: rgba(245, 158, 11, 0.3) !important;
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.7) !important;
      animation: badgeShake 0.4s ease-in-out;
    }

    @keyframes badgeShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

  </style>
</head>
<body>

  <!-- Screen Reader Live Region for Non-Visual State Announcements -->
  <div id="a11y-status-announcer" class="sr-only" aria-live="polite" aria-atomic="true">
    Pi-Box physical intelligence platform. Front card emblem active. Press Enter or Space to flip card.
  </div>

  <!-- Background Canvas -->
  <div class="bg-mesh-gradient" aria-hidden="true"></div>
  <div class="bg-grid-pattern" aria-hidden="true"></div>
  <div class="bg-toplid-layer" id="bg-toplid-layer" aria-hidden="true"></div>

  <!-- Hero Stage -->
  <main class="hero-stage">
    
    <!-- Hidden Checkbox Trigger for Flip State -->
    <input type="checkbox" id="pibox-toggle" class="pibox-toggle" aria-hidden="true" />

    <!-- 3D Card Wrapper Container -->
    <div id="pibox-card" class="pibox-card-container">
      <div class="pibox-card-inner">

        <!-- FRONT FACE: macOS Glass Icon -->
        <label 
          for="pibox-toggle" 
          class="card-face front-face"
          tabindex="0"
          role="button"
          aria-label="Pi-Box logo: Pi symbol inside double mathematical brackets. Click or press Enter to flip to writing pane."
          id="front-card-label"
        >
          <div id="pibox-symbol" class="pibox-symbol" aria-label="Pi-Box emblem: Pi symbol inside double mathematical brackets">
            <span class="bracket bracket-left" aria-hidden="true">⟦</span>
            <span class="pi-char">π</span>
            <span class="bracket bracket-right" aria-hidden="true">⟧</span>
          </div>
        </label>

        <!-- BACK FACE: STEADY WRITING PANE (Symmetric 36px Equal Padding) -->
        <div class="card-face back-face" role="region" aria-label="Pi-Box interactive prompt writing pane">
          
          <!-- Notebook Line 1: Header Bar, Status Indicator & Transparent Imprint -->
          <div class="card-imprint-symbol" aria-hidden="true">⟦π⟧</div>
          <div class="pane-header" role="region" aria-label="Language-free system status and close control stage">
            <span id="status-text-accessible" class="sr-only">Status: Standby Blue</span>
            <!-- Bounded Top Bounding-Box Stage for Language-Free 3D Game Die Cube Status & Close Controller -->
            <div class="die-header-stage">
              <label 
                for="pibox-toggle" 
                class="die-status-cube state-standby gear-1" 
                id="flip-back-btn" 
                tabindex="0" 
                role="button" 
                aria-label="Pi-Box system status cube and card close controller (3D Game Die)"
                title="Click to flip card closed. Color/motion indicates system status."
              >🎲</label>
            </div>
          </div>

          <!-- Notebook Line 2: AI Stream Response Area -->
          <div class="ai-stream-container" aria-live="polite" aria-atomic="true" id="ai-response-box">
            <span id="stream-text">Hello, I am your Pi-Box ... hold your spoon ready!</span><span class="ai-cursor" aria-hidden="true"></span>
          </div>

          <!-- Notebook Lines 3-8: Interactive 6-Line Centered Human Prompt Textarea (300 Chars Max) -->
          <label for="human-prompt-input" class="sr-only">Enter your prompt or passphrase for Pi-Box (maximum 300 characters)</label>
          <textarea 
            id="human-prompt-input"
            class="human-prompt-textarea" 
            placeholder="Place your order here ..." 
            spellcheck="false"
            maxlength="300"
            aria-multiline="true"
          ></textarea>

          <!-- Notebook Lines 9+: Reserved Footer Tray (8x1 EU Symmetrical Grid & Version Badge) -->
          <div class="pane-footer-tray" id="pane-footer-tray" aria-live="polite">
            
            <!-- Symmetrical 8x1 Grid Row -->
            <div class="grid-container-row" id="grid-container-row" role="group" aria-label="Language selector and character counters">
              <!-- Grid Elements 1-6: EU Flags -->
              <button type="button" class="lang-flag-btn" data-lang="NL"  aria-label="Nederlands">NL</button>
              <button type="button" class="lang-flag-btn" data-lang="EN"  aria-label="English">EN</button>
              <button type="button" class="lang-flag-btn" data-lang="DE"  aria-label="Deutsch">DE</button>
              <button type="button" class="lang-flag-btn" data-lang="FR"  aria-label="Français">FR</button>
              <button type="button" class="lang-flag-btn" data-lang="ES"  aria-label="Español">ES</button>
              <button type="button" class="lang-flag-btn" data-lang="IT"  aria-label="Italiano">IT</button>
              <!-- Extra INT Language Elements (Hidden in EU 8x1 Mode) -->
              <button type="button" class="lang-flag-btn int-only-flag" data-lang="PT" aria-label="Português" style="display: none;">PT</button>
              <button type="button" class="lang-flag-btn int-only-flag" data-lang="CN" aria-label="Chinese" style="display: none;">CN</button>
              <button type="button" class="lang-flag-btn int-only-flag" data-lang="RU" aria-label="Russian" style="display: none;">RU</button>
              <button type="button" class="lang-flag-btn int-only-flag" data-lang="JP" aria-label="Japanese" style="display: none;">JP</button>

              <!-- Grid Element 7: Count-Down Button (-remaining) -->
              <button type="button" class="counter-grid-btn btn-down state-zero" id="counter-btn-down" title="Characters remaining" aria-label="Characters remaining">-300</button>

              <!-- Grid Element 8 (Last Position): Count-Up / Release Button (+typed) -->
              <button type="button" class="counter-grid-btn btn-up" id="counter-btn-up" title="Characters typed (Click to submit prompt)" aria-label="Characters typed">+0</button>
            </div>

            <!-- Bottom Sub-Row: 2x1 Grid Mode Switcher & Centered ⟦V25h⟧ Reference Badge -->
            <div class="grid-subrow" id="grid-subrow">
              
              <!-- 2x1 Grid Mode Switcher (Fits under flag columns) -->
              <div class="mode-switcher-container" role="group" aria-label="Language grid mode selector">
                <!-- Left Button: EU Mode (Default Active) -->
                <button type="button" class="mode-switch-btn btn-eu is-active" id="btn-mode-eu" aria-label="European Grid Mode">
                  
                  <span class="mode-label">EUR</span>
                </button>
                
                <!-- Right Button: Global INT Mode -->
                <button type="button" class="mode-switch-btn btn-int" id="btn-mode-int" aria-label="Global Grid Mode">
                  
                  <span class="mode-label">INT</span>
                </button>
              </div>

              <!-- Standalone ERASE Button (Fits under counter columns) -->
              <div class="erase-btn-container">
                <button type="button" class="erase-btn" id="btn-erase" title="Clear prompt text" aria-label="Clear prompt text">
                  <span>🧹 ERASE</span>
                </button>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Stage-Level South Door Navigation Trigger (Positioned OUTSIDE .pibox-card-container) -->
    
  </main>

  <!-- Viewport-Anchored Outer Navigation Controls (Outside <main> Hero Stage & Card Bounding Box) -->
  <div class="viewport-nav-bar viewport-nav-west">
    <button type="button" class="viewport-nav-handle nav-handle-west" id="version-west-badge" aria-label="Navigate West">
      <span aria-hidden="true">◄</span>
    </button>
  </div>

  <div class="viewport-nav-bar viewport-nav-east">
    <button type="button" class="viewport-nav-handle nav-handle-east" id="version-east-badge" aria-label="Navigate East">
      <span aria-hidden="true">►</span>
    </button>
  </div>

  <div class="viewport-nav-bar viewport-nav-south">
    <span class="version-south-badge" id="version-south-badge" tabindex="0" role="button" aria-label="Version 25k south door trigger">
      <span class="version-text">⟦V25u⟧</span>
      <span class="south-arrow" aria-hidden="true"> ⬇</span>
    </span>
  </div>

  <script>
    (function() {
      const toggle = document.getElementById('pibox-toggle');
      const frontCardLabel = document.getElementById('front-card-label');
      const promptInput = document.getElementById('human-prompt-input');
      const streamText = document.getElementById('stream-text');
      const statusAccessibleText = document.getElementById('status-text-accessible');
      const a11yAnnouncer = document.getElementById('a11y-status-announcer');
      const closeBtn = document.getElementById('flip-back-btn');

      let isAnimating = false;
      
      const i18n = {
        EN: {
          bcp47: "en-US",
          greeting: "Hello, I am your Pi-Box ... hold your spoon ready!",
          response: "Sorry ... your spoon does not fit ... try again !!",
          placeholderVoice: "I will listen until you say READY",
          placeholderText: "Place your order here ..."
        },
        NL: {
          bcp47: "nl-NL",
          greeting: "Hallo, ik ben jouw Pi-Box ... houd je lepel klaar!",
          response: "Helaas ... je lepel past niet ... probeer opnieuw!",
          placeholderVoice: "Ik luister totdat je KLAAR zegt",
          placeholderText: "Plaats je bestelling hier ..."
        },
        DE: {
          bcp47: "de-DE",
          greeting: "Hallo, ich bin deine Pi-Box ... Löffel bereit !!!!",
          response: "Leider ... dein Löffel passt nicht ... nochmal !!!",
          placeholderVoice: "Ich höre zu, bis du BEREIT sagst",
          placeholderText: "Gib deine Bestellung hier ein ..."
        },
        FR: {
          bcp47: "fr-FR",
          greeting: "Bonjour, je suis votre Pi-Box ... cuillère prête !",
          response: "Désolé ... votre cuillère ne va pas ... réessayez!",
          placeholderVoice: "J'écoute jusqu'à ce que vous disiez PRÊT",
          placeholderText: "Passez votre commande ici ..."
        },
        ES: {
          bcp47: "es-ES",
          greeting: "¡Hola, soy tu Pi-Box ... ten lista tu cuchara ya !",
          response: "Lo siento ... tu cuchara no encaja ... reintenta !",
          placeholderVoice: "Escucharé hasta que digas LISTO",
          placeholderText: "Realiza tu pedido aquí ..."
        },
        IT: {
          bcp47: "it-IT",
          greeting: "Ciao, sono la tua Pi-Box ... tieni il cucchiaio  !",
          response: "Spiacente ... il tuo cucchiaio non va ... riprova!",
          placeholderVoice: "Ascolterò finché non dici PRONTO",
          placeholderText: "Invia il tuo ordine qui ..."
        }
      };

      let currentLang = 'EN';
      let currentGreeting = i18n.EN.greeting;
      let currentAiResponse = i18n.EN.response;

      const hasVoiceSupport = ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) ||
                              (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ||
                              ('speechSynthesis' in window);

      function applyLanguage(langCode) {
        if (!i18n[langCode]) langCode = 'EN';
        currentLang = langCode;
        const langData = i18n[langCode];
        currentGreeting = langData.greeting;
        currentAiResponse = langData.response;

        document.documentElement.setAttribute('lang', langData.bcp47.split('-')[0]);

        if (hasVoiceSupport) {
          if (promptInput) promptInput.placeholder = langData.placeholderVoice;
        } else {
          if (promptInput) promptInput.placeholder = langData.placeholderText;
        }

        if (!isAnimating && streamText) {
          streamText.textContent = currentGreeting;
        }
      }

      // F1 Gear & Die Status Driver
      function setDieStatus(gearClass, statusDesc) {
        if (statusAccessibleText) statusAccessibleText.textContent = 'Status: ' + statusDesc;
        if (a11yAnnouncer) a11yAnnouncer.textContent = 'System Status: ' + statusDesc;

        if (closeBtn) {
          closeBtn.classList.remove('gear-1', 'gear-2', 'gear-turbo', 'state-standby', 'state-yellow', 'state-red');
          if (gearClass.includes('gear-turbo') || gearClass.includes('state-red')) {
            closeBtn.classList.add('gear-turbo', 'state-red');
          } else if (gearClass.includes('gear-2') || gearClass.includes('state-yellow')) {
            closeBtn.classList.add('gear-2', 'state-yellow');
          } else {
            closeBtn.classList.add('gear-1', 'state-standby');
          }
        }
      }

      // Dynamic Counter Logic
      const counterBtnUp = document.getElementById('counter-btn-up');
      const counterBtnDown = document.getElementById('counter-btn-down');

      function updateCounters() {
        if (!promptInput) return;
        const typed = promptInput.value.length;
        const remaining = 300 - typed;

        if (counterBtnUp) {
          counterBtnUp.textContent = '+' + typed;
          if (typed > 0) {
            counterBtnUp.classList.add('is-clickable');
          } else {
            counterBtnUp.classList.remove('is-clickable');
          }
        }

        if (counterBtnDown) {
          counterBtnDown.textContent = '-' + remaining;
          counterBtnDown.classList.remove('state-zero', 'state-yellow', 'state-red');
          if (typed === 0) {
            counterBtnDown.classList.add('state-zero');
          } else if (typed === 300) {
            counterBtnDown.classList.add('state-red');
          } else {
            counterBtnDown.classList.add('state-yellow');
          }
        }

        // Drive F1 Die Gear based on prompt input
        if (!isAnimating) {
          if (typed === 0) {
            setDieStatus('gear-1 state-standby', 'First Gear / Idle (Blue)');
          } else if (typed === 300) {
            setDieStatus('gear-turbo state-red', 'Red Warning Max (300 Chars)');
          } else {
            setDieStatus('gear-2 state-yellow', 'Second Gear Cruising (' + typed + ' Chars)');
          }
        }
      }

      // +event Submit Handler
      function handleUpSubmit(e) {
        if (e) e.preventDefault();
        if (promptInput && promptInput.value.trim().length > 0 && !isAnimating) {
          runSimulatedSequence();
        } else if (promptInput && promptInput.value.trim().length === 0) {
          if (counterBtnUp) {
            counterBtnUp.classList.add('is-warning');
            setTimeout(() => counterBtnUp.classList.remove('is-warning'), 800);
          }
          if (a11yAnnouncer) a11yAnnouncer.textContent = 'Please enter a prompt first!';
        }
      }

      if (counterBtnUp) {
        counterBtnUp.addEventListener('click', handleUpSubmit);
      }

      if (counterBtnDown) {
        counterBtnDown.addEventListener('click', function(e) {
          if (e) e.preventDefault();
          if (promptInput && promptInput.value.length > 0) {
            promptInput.value = '';
            updateCounters();
            promptInput.focus();
            if (a11yAnnouncer) a11yAnnouncer.textContent = 'Prompt input cleared.';
          }
        });
      }

      if (promptInput) {
        promptInput.addEventListener('input', updateCounters);
        promptInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleUpSubmit(e);
          }
        });
      }

      // Simulated AI Sequence
      function runSimulatedSequence() {
        if (isAnimating) return;
        isAnimating = true;
        promptInput.value = '';
        updateCounters();

        setDieStatus('gear-2 state-yellow', 'Clearing prompt...');
        
        let currentText = streamText ? streamText.textContent : '';
        const recedeInterval = setInterval(function() {
          if (currentText.length > 0) {
            currentText = currentText.substring(0, currentText.length - 1);
            if (streamText) streamText.textContent = currentText;
          } else {
            clearInterval(recedeInterval);
            
            setTimeout(function() {
              setDieStatus('gear-turbo state-red', 'AI Generating Response...');
              let charIndex = 0;
              const typeInterval = setInterval(function() {
                if (charIndex < currentAiResponse.length) {
                  if (streamText) streamText.textContent += currentAiResponse.charAt(charIndex);
                  charIndex++;
                } else {
                  clearInterval(typeInterval);
                  
                  setTimeout(function() {
                    setDieStatus('gear-1 state-standby', 'First Gear / Idle Ready (Blue)');
                    isAnimating = false;
                  }, 800);
                }
              }, 45);
            }, 300);
          }
        }, 22);
      }

      // 2x1 Grid Mode Switcher
      const btnModeEu = document.getElementById('btn-mode-eu');
      const btnModeInt = document.getElementById('btn-mode-int');
      const gridContainerRow = document.getElementById('grid-container-row');
      const gridSubrow = document.getElementById('grid-subrow');
      const intOnlyFlags = document.querySelectorAll('.int-only-flag');

      function setGridMode(isINT) {
        if (isINT) {
          if (gridContainerRow) gridContainerRow.classList.add('mode-int');
          if (gridSubrow) gridSubrow.classList.add('mode-int');
          intOnlyFlags.forEach(f => f.style.display = 'inline-flex');
          if (btnModeInt) btnModeInt.classList.add('is-active');
          if (btnModeEu) btnModeEu.classList.remove('is-active');
          if (a11yAnnouncer) a11yAnnouncer.textContent = 'Switched to International 12x1 grid mode (10 languages).';
        } else {
          if (gridContainerRow) gridContainerRow.classList.remove('mode-int');
          if (gridSubrow) gridSubrow.classList.remove('mode-int');
          intOnlyFlags.forEach(f => f.style.display = 'none');
          if (btnModeEu) btnModeEu.classList.add('is-active');
          if (btnModeInt) btnModeInt.classList.remove('is-active');
          if (a11yAnnouncer) a11yAnnouncer.textContent = 'Switched to European 8x1 grid mode (6 languages).';
        }
      }

      if (btnModeEu) btnModeEu.addEventListener('click', function() { setGridMode(false); });
      if (btnModeInt) btnModeInt.addEventListener('click', function() { setGridMode(true); });

      // Language Selectors
      const langBtns = document.querySelectorAll('.lang-flag-btn');
      const activeLang = 'EN';
      applyLanguage(activeLang);

      langBtns.forEach(btn => {
        const lang = btn.getAttribute('data-lang');
        btn.textContent = lang;
        btn.addEventListener('click', function() {
          langBtns.forEach(b => {
            b.classList.remove('is-selected', 'is-detected');
            b.textContent = b.getAttribute('data-lang');
          });
          btn.classList.add('is-selected');
          btn.textContent = lang;
          applyLanguage(lang);
          if (a11yAnnouncer) a11yAnnouncer.textContent = 'Language selected: ' + lang;
        });
      });

      // ERASE Handler
      const btnErase = document.getElementById('btn-erase');
      function executeErase(e) {
        if (e) e.preventDefault();
        if (promptInput) {
          promptInput.value = '';
          updateCounters();
          promptInput.focus();
          if (a11yAnnouncer) a11yAnnouncer.textContent = 'Prompt text erased.';
        }
      }

      if (btnErase) {
        btnErase.addEventListener('click', executeErase);
      }

      // Card Opening & Flip Smooth Transition Trigger
      if (toggle) {
        toggle.addEventListener('change', function() {
          if (toggle.checked) {
            if (a11yAnnouncer) a11yAnnouncer.textContent = "Writing pane opened. Focus on prompt textarea.";
            
            // Trigger right-to-left entry roll animation on 3D die status cube
            if (closeBtn) {
              closeBtn.classList.add('is-entering');
              setTimeout(() => {
                closeBtn.classList.remove('is-entering');
              }, 1200);
            }

            // Smoothly delay focus and initial stream greeting by 600ms after flip completes
            setTimeout(() => {
              if (promptInput) promptInput.focus();
              if (streamText && !isAnimating) streamText.textContent = currentGreeting;
            }, 600);
          } else {
            if (a11yAnnouncer) a11yAnnouncer.textContent = "Card flipped back to front logo.";
            if (frontCardLabel) frontCardLabel.focus();
          }
        });
      }

      if (frontCardLabel) {
        frontCardLabel.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (toggle) toggle.checked = !toggle.checked;
            toggle.dispatchEvent(new Event('change'));
          }
        });
      }

      // Stage Navigation Handles (West, East, South)
      const versionSouthBadge = document.getElementById('version-south-badge');
      const versionWestBadge = document.getElementById('version-west-badge');
      const versionEastBadge = document.getElementById('version-east-badge');

      function handleCardNavigation(direction, element) {
        const dirSymbol = direction === 'west' ? '◄' : direction === 'east' ? '►' : '⬇';
        if (promptInput && promptInput.value.length > 0) {
          if (element) element.classList.add('is-warning');
          if (a11yAnnouncer) a11yAnnouncer.textContent = `⛔ 🧹 Erase text before moving ${direction}`;
          
          const origStream = streamText ? streamText.textContent : '';
          if (streamText) {
            streamText.textContent = `⛔ 🧹  [ ERASE TEXT ]  ${dirSymbol}`;
            streamText.style.color = '#f59e0b';
          }
          
          setTimeout(() => {
            if (element) element.classList.remove('is-warning');
            if (streamText) {
              streamText.textContent = origStream;
              streamText.style.color = '#f8fafc';
            }
          }, 2600);
        } else {
          if (a11yAnnouncer) a11yAnnouncer.textContent = `🔓 ${dirSymbol} ${direction.toUpperCase()} unlocked`;
          const origStream = streamText ? streamText.textContent : '';
          if (streamText) {
            streamText.textContent = `🔓  ${dirSymbol}  ${direction.toUpperCase()} UNLOCKED`;
            streamText.style.color = '#00d2ff';
          }
          
          setTimeout(() => {
            if (streamText) {
              streamText.textContent = origStream;
              streamText.style.color = '#f8fafc';
            }
          }, 2200);
        }
      }

      function bindNavEvents(element, direction) {
        if (!element) return;
        element.addEventListener('click', (e) => {
          if (e) e.preventDefault();
          handleCardNavigation(direction, element);
        });
      }

      bindNavEvents(versionSouthBadge, 'south');
      bindNavEvents(versionWestBadge, 'west');
      bindNavEvents(versionEastBadge, 'east');

    })();
</script>
</body>
</html>
